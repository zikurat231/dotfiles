#setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
#set -g message-style 'fg=yellow bg=red bold'

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g status-style bg=default,fg=white

# Левая часть: Имя сессии
set -g status-left "#[fg=blue,bold] #S #[default] "

# Список окон: активное выделяем цветом
# set -g window-status-current-format "#[fg=#ff9e64,bold] ● #I:#W #[default]"
set -g window-status-current-format "#[bg=#3b4261,fg=#7aa2f7,bold] ● #I:#W  #[default]"
set -g window-status-format "#[fg=brightblack] ○ #I:#W #[default]"

# Правая часть: время и дата
set -g status-right "#[fg=cyan] %H:%M #[fg=brightblack]| #[fg=white]%d-%b-%y "

# Рамки панелей (сделай их тонкими и неяркими)
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=#3b4261

set -g message-style "fg=#7aa2f7,bg=#16161e" 

set -g repeat-time 800

bind-key -r C-h resize-pane -L 4 
bind-key -r C-j resize-pane -D 4 
bind-key -r C-k resize-pane -U 4 
bind-key -r C-l resize-pane -R 4 
