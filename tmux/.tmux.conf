# Ctrl+b -> Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split window using new hotkeys
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

#bind-key -n C-t new-window
#bind-key -n C-w kill-window
# bind-key -n C-Tab next-window

# Set fast reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Set fast switch panel to Alt + Arrow
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Enable mouse
set -g mouse on

set-option -g allow-rename off

# Start with first panel
set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi

unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"


set-option -g history-limit 30000
#bind -T copy-mode-vi r send-keys -X rectangle-toggle 
#bind -t copy-mode-vi Escape cancel
